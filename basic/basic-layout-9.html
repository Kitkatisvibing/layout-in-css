<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 9</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      /* Doe hier jouw ding! */
      body{
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(5, 1fr);
        grid-column-gap: 10px;
        grid-row-gap: 10px;
      }

      header{
        grid-area: 1 / 1 / 2 / 2;
      }

      nav{
        grid-area: 1 / 2 / 2 / 4;
        display: flex;
        align-items: center;
        justify-content: space-evenly;

          a{
            background-color: white;
            padding: 5px;
            border-radius: 5px;
          }
      }

      main{
        grid-area: 2 / 1 / 5 / 4;
      }

      footer{
        grid-area: 5 / 1 / 6 / 4;
      }
    </style>
  </head>
  <body id="basic-layout-9">
    <header><h1>Basic Layout 9</h1></header>
    <nav>
      <a href="#">Home</a>
      <a href="#">Over ons</a>
      <a href="#">Contact</a>
    </nav>
    <main><a href="../index.html">Terug naar het overzicht</a></main>
    <footer></footer>
  </body>
</html>
